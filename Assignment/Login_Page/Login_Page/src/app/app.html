<div class="login-bg">
  <div class="login-card">

    <p class="subtitle">Please enter your details</p>

    <h1 class="login-title">Welcome back</h1>

    <div class="mb-3">
      <input
        type="email"
        class="form-control"
        placeholder="Email address"
        [(ngModel)]="email">
    </div>

    <div class="mb-3">
      <input
        type="password"
        class="form-control"
        placeholder="Password"
        [(ngModel)]="password">
    </div>

    <div class="options">
      <div>
        <input type="checkbox">
        <span>Remember for 30 days</span>
      </div>

      <a href="#">Forgot password</a>
    </div>

    <button class="btn btn-primary login-btn"
            (click)="Login()">
      Sign In
    </button>

    <button class="google-btn">
      Sign in with Google
    </button>

    <p class="signup-text">
      Don't have an account?
      <a href="#">Sign up</a>
    </p>

  </div>
</div>
