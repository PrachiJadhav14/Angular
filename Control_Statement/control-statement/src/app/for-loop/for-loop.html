@for(item of Users ; track item){
<h1>{{item}}</h1>
}
<hr>
@for (Student of students; track Student.name; let id = $index) {
  <h1>
    <span>{{id}}</span>
    <span>{{Student.name}}</span>
    <span>{{Student.age}}</span>
    <span>{{Student.Email}}</span>
    <button (click)="getname(Student.name)">Get Name</button>
  <button (click)="getage(Student.age)">Get Age</button>
  <button (click)="getemail(Student.Email)">Get Email</button>
  </h1>


}
