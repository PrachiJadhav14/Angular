<h1>Event in Angular</h1>
<button class="btn" name="login" (click)="handleEvent($event)">Click Me</button>
<br><br>
<div (mouseenter)="handleEvent($event)"
style="background-color: green; width: 100px; height: 100px;"></div>
<br><br>
<div (mouseleave)="handleEvent($event)"
style="background-color: rgb(211, 32, 47); width: 100px; height: 100px;"></div>
<br><br>

<input type="text"
(focus)="handleEvent($event)"
(blur)="handleEvent($event)"
(input)="handleEvent($event)"
name="user">
